name: Bug report
description: Report a reproducible problem in the managed or raw API
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Please remove proprietary models, runtime binaries and credentials.
  - type: input
    id: version
    attributes:
      label: Package commit or version
      placeholder: "main @ abc1234 or 0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include OS/architecture, Nim version, OpenVINO version and device.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest runnable example and exact command.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Actual output
      description: Paste the complete error and relevant diagnostics.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
